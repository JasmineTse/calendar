<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a83f39">
  <meta name="description" content="无广告离线万年历：农历节气、法定节假日调休、黄历宜忌、日程提醒、生理期记录">
  <title>万年历</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="万年历">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <main id="view-calendar" class="tab-view"></main>
    <main id="view-poem" class="tab-view" hidden></main>
    <main id="view-zodiac" class="tab-view" hidden></main>
    <main id="view-period" class="tab-view" hidden></main>
    <main id="view-settings" class="tab-view" hidden></main>
  </div>

  <div id="overlay-root"></div>
  <div id="picker-root" data-open="0"></div>
  <div id="history-root"></div>
  <div id="lock-root"></div>

  <nav class="tabbar">
    <button data-action="tab" data-tab="calendar" class="on">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      日历
    </button>
    <button data-action="tab" data-tab="poem">
      <svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v15H8a3 3 0 0 1-3-3z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      每日一诗
    </button>
    <button data-action="tab" data-tab="zodiac">
      <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.4L19 10.3l-5.1 1.9L12 17.6l-1.9-5.4L5 10.3l5.1-1.9z"/><path d="M18.5 16.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>
      星座
    </button>
    <button data-action="tab" data-tab="period">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="3.5"/></svg>
      生理期
    </button>
    <button data-action="tab" data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8l1.2 2.6 2.8-.6 1 2.7 2.8.8-.6 2.8 2 2-2 2 .6 2.8-2.8.8-1 2.7-2.8-.6L12 21.2l-1.2-2.6-2.8.6-1-2.7-2.8-.8.6-2.8-2-2 2-2-.6-2.8 2.8-.8 1-2.7 2.8.6z"/></svg>
      设置
    </button>
  </nav>

  <script src="js/lib/lunar.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
